# 10-durcissement.conf - durcissement du serveur SSH (exigences S1 à S5)
# Projet XTI302-CYB, contexte B : Chiffres & Co.
#
# Installé dans /etc/ssh/sshd_config.d/ par installer.sh, validé par
# « sshd -t » avant tout redémarrage (S5).
#
# Les fichiers de sshd_config.d sont lus par ordre alphabétique et, pour
# chaque option, la PREMIÈRE valeur lue l'emporte. Le préfixe « 10- » fait
# passer ces réglages avant ceux des autres fichiers et de sshd_config.

# --- S1 : authentification par clé uniquement ----------------------------
PubkeyAuthentication yes
PasswordAuthentication no
# Sans cette ligne, PAM pourrait encore demander un mot de passe
# par la méthode « keyboard-interactive ».
KbdInteractiveAuthentication no

# --- S2 : pas de connexion directe en root -------------------------------
PermitRootLogin no

# --- S3 : seuls les membres du groupe acces_ssh peuvent se connecter ----
AllowGroups acces_ssh

# --- S4 : essais limités et sessions inactives fermées -------------------
# 3 essais par connexion (4 au plus exigé). Chaque clé proposée par
# l'agent SSH compte comme un essai.
MaxAuthTries 3

# Ferme une session sans aucun échange pendant 10 minutes (15 au plus
# exigé). C'est cette option qui gère l'inactivité de l'utilisateur.
ChannelTimeout session=10m
# Ferme une connexion qui n'a plus aucune session ouverte.
UnusedConnectionTimeout 10m

# Complément : détecte un client qui ne répond plus (réseau coupé). Le
# serveur le sonde toutes les 5 min et coupe après 2 sondes sans réponse.
# Seul, ce réglage ne ferme PAS une session simplement inactive : le
# client SSH répond automatiquement aux sondes.
ClientAliveInterval 300
ClientAliveCountMax 2
