# 10-durcissement.conf - durcissement du serveur SSH (exigences S1 à S5)
# Projet XTI302-CYB, contexte B : Chiffres & Co.

#S1 : authentification par clé uniquement
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no

#S2 : pas de connexion directe en root
PermitRootLogin no

#S3 : seuls les membres du groupe acces_ssh peuvent se connecter
AllowGroups acces_ssh

#S4 : essais limités et sessions inactives fermées
MaxAuthTries 3
ChannelTimeout session=10m
UnusedConnectionTimeout 10m

# Complément : détecte un client qui ne répond plus (réseau coupé). Le
# serveur le sonde toutes les 5 min et coupe après 2 sondes sans réponse.
# Seul, ce réglage ne ferme PAS une session simplement inactive : le
# client SSH répond automatiquement aux sondes.
ClientAliveInterval 300
ClientAliveCountMax 2
