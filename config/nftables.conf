#!/usr/sbin/nft -f
#
# nftables.conf - pare-feu du serveur (exigence J2)
# Projet XTI302-CYB, contexte B : Chiffres & Co.
#
# Installé dans /etc/nftables.conf par installer.sh, après validation par
# « nft -c -f ». Le service nftables, activé au démarrage, recharge ce
# fichier à chaque redémarrage : la règle survit au redémarrage.
#
# Principe : tout ce qui entre est refusé, sauf SSH et les réponses aux
# connexions déjà établies.

# Cohabitation avec fail2ban (J1) : on ne vide PAS tout le pare-feu
# (pas de « flush ruleset »), sinon recharger ce fichier effacerait la
# table de fail2ban et ses bannissements. On remplace seulement notre table :
# la première ligne la crée si elle n'existe pas, la deuxième la supprime,
# puis elle est redéfinie en entier. Le fichier est appliqué d'un bloc :
# il n'y a jamais d'instant sans pare-feu.
table inet filtre
delete table inet filtre

# « inet » : une seule table pour IPv4 et IPv6
table inet filtre {

    chain entree {
        # policy drop : un paquet qu'aucune règle n'accepte est jeté
        type filter hook input priority filter; policy drop;

        # Réponses aux connexions établies, et paquets liés (par exemple les
        # erreurs ICMP qui concernent une connexion en cours)
        ct state established,related accept

        # Paquets incohérents pour le suivi de connexion
        ct state invalid drop

        # Boucle locale : les services de la machine se parlent entre eux
        iif "lo" accept

        # SSH, seul service ouvert vers l'extérieur
        tcp dport 22 accept

        # IPv6 ne fonctionne pas sans la découverte des voisins (l'équivalent
        # d'ARP, qui en IPv4 n'est pas filtré par nftables)
        icmpv6 type { nd-neighbor-solicit, nd-neighbor-advert, nd-router-advert } accept

        # Ping refusé : le serveur ne répond pas aux balayages réseau simples.
        # Pour l'autoriser, décommenter les deux lignes suivantes.
        # icmp type echo-request limit rate 5/second accept
        # icmpv6 type echo-request limit rate 5/second accept

        # Trace des paquets refusés (au plus 5 par minute pour ne pas noyer
        # le journal), visible avec « journalctl -k | grep nft-refus »
        limit rate 5/minute log prefix "nft-refus: "
    }

    chain transfert {
        # Le serveur n'est pas un routeur : rien ne le traverse
        type filter hook forward priority filter; policy drop;
    }

    chain sortie {
        # Le serveur peut initier ses connexions (mises à jour apt, DNS...)
        type filter hook output priority filter; policy accept;
    }
}
