# sshd.conf - protection de SSH par fail2ban (exigence J1)
# Projet XTI302-CYB, contexte B : Chiffres & Co.
#
[sshd]
enabled = true

backend = systemd

port = ssh

# Bannissement après 3 échecs en 10 minutes, pendant 10 minutes.
maxretry = 3
findtime = 10m
bantime = 10m

# Bannissement par nftables, dans la table « inet f2b-table » de fail2ban,
# distincte de la table « inet filtre » du pare-feu (J2).
banaction = nftables-multiport
banaction_allports = nftables-allports

action = %(action_)s[actionstart_on_demand=false]

# Adresses jamais bannies :
ignoreip = 127.0.0.1/8 ::1
