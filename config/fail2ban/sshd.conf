# sshd.conf - protection de SSH par fail2ban (exigence J1)
# Projet XTI302-CYB, contexte B : Chiffres & Co.
#
# Installé dans /etc/fail2ban/jail.d/ par installer.sh, après validation par
# « fail2ban-client -t ».
#
# Contrairement à sshd, fail2ban lit les fichiers de jail.d par ordre
# alphabétique et c'est la DERNIÈRE valeur lue qui l'emporte : ce fichier
# passe après defaults-debian.conf, fourni par le paquet Debian.

[sshd]
enabled = true

# Debian 13 n'installe pas rsyslog : il n'y a pas de /var/log/auth.log.
# sshd écrit uniquement dans le journal systemd, que fail2ban lit
# directement (paquet python3-systemd).
backend = systemd

port = ssh

# Bannissement après 3 échecs en 10 minutes, pendant 10 minutes.
# Avec l'authentification par clé seule, un utilisateur légitime n'échoue
# pas : 3 échecs signalent un robot. 10 minutes de bannissement suffisent à
# casser une attaque automatique sans bloquer longtemps une erreur humaine,
# et permettent de démontrer le débannissement sans attendre trop longtemps.
maxretry = 3
findtime = 10m
bantime = 10m

# Bannissement par nftables, dans la table « inet f2b-table » de fail2ban,
# distincte de la table « inet filtre » du pare-feu (J2).
banaction = nftables-multiport
banaction_allports = nftables-allports

# Par défaut, fail2ban ne crée sa table qu'au premier bannissement. On la
# crée dès le démarrage : la présence des règles de fail2ban dans nftables
# devient vérifiable à tout moment, même avant toute attaque.
action = %(action_)s[actionstart_on_demand=false]

# Adresses jamais bannies : la machine elle-même uniquement. L'hôte n'est
# volontairement PAS exclu, pour pouvoir faire la démonstration depuis lui.
ignoreip = 127.0.0.1/8 ::1
